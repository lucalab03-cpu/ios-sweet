name: mesa-src
# Prints parts of the patched Mesa 26.2.7 tree to the log (reading PanVK's code without a local copy).
on:
  workflow_dispatch:
    inputs:
      cmd:
        description: shell command run inside mesa-26.2.7 (its output goes to the log)
        required: true
jobs:
  show:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mesa 26.2.7
        run: |
          curl -sL --fail --retry 5 -o mesa.tar.xz https://archive.mesa3d.org/mesa-26.2.7.tar.xz
          echo "04294f75d22e9f61cd1e050206bc48b3d39366e788f1803a3368e3d5a872ce18  mesa.tar.xz" | sha256sum -c
          tar xJf mesa.tar.xz
          python3 -I tools/panvk-ios/patch-panvk.py "$PWD/mesa-26.2.7" "$PWD/tools/panvk-ios/sweet-drm" > /dev/null
      - name: Show
        env:
          CMD: ${{ inputs.cmd }}
        run: |
          cd mesa-26.2.7
          bash -c "$CMD"
