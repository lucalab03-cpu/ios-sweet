name: mesa-ios
# Gallium/Panfrost (Mesa 25.0.7, OSMesa) for iOS over SweetMali, and CoreAnimation's OpenGL ES behind it
# (tools/sweetgl, from HakiOS): libOSMesa.8.dylib with OpenGL ES contexts and IOSurface textures, libsweet-gl.dylib
# (our EAGLContext for the window server), gltest and drawtest, and the backboardd wrapper and sweetinject that
# load it when /var/sweet/gl exists.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: runner label (macos-15-intel when the arm64 Macs are queued)
        required: false
        default: macos-15
  push:
    paths:
      - 'tools/mesa-ios/**'
      - 'tools/sweetgl/**'
      - '.github/workflows/mesa-ios.yml'
jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          brew install meson ninja bison flex pkg-config python-setuptools
          pip3 install --break-system-packages mako pyyaml packaging || pip3 install mako pyyaml packaging
          echo "$(brew --prefix)/opt/bison/bin:$(brew --prefix)/opt/flex/bin" >> $GITHUB_PATH
      - name: Mesa 25.0.7
        run: |
          curl -sL --fail --retry 5 -o mesa.tar.xz https://archive.mesa3d.org/mesa-25.0.7.tar.xz
          echo "592272df3cf01e85e7db300c449df5061092574d099da275d19e97ef0510f8a6  mesa.tar.xz" | shasum -a 256 -c
          tar xJf mesa.tar.xz
          python3 -I tools/mesa-ios/patch-mesa.py "$PWD/mesa-25.0.7" "$PWD/tools/mesa-ios"
      - name: Configure
        run: |
          cd mesa-25.0.7
          meson setup build --cross-file ../tools/mesa-ios/ios.cross --prefix /usr/local \
            -Dbuildtype=release -Dsweet-ios=true -Dgallium-drivers=panfrost,softpipe \
            -Dvulkan-drivers= -Dllvm=disabled -Dplatforms= -Dglx=disabled -Degl=disabled -Dgbm=disabled \
            -Dgles1=disabled -Dgles2=enabled -Dopengl=true -Dosmesa=true -Dshared-glapi=enabled \
            -Dshader-cache=disabled -Dxmlconfig=disabled -Dexpat=disabled -Dzstd=disabled -Dlmsensors=disabled -Dvalgrind=disabled \
            -Dlibunwind=disabled -Dgallium-va=disabled -Dgallium-vdpau=disabled -Dgallium-xa=disabled \
            -Dtools= -Dbuild-tests=false -Dmesa-clc=auto -Dprecomp-compiler=auto \
            || { cat build/meson-logs/meson-log.txt | tail -80; exit 1; }
      - name: Build
        run: |
          cd mesa-25.0.7
          ninja -C build src/gallium/targets/osmesa/libOSMesa.8.dylib 2>&1 | tail -150
          test -f build/src/gallium/targets/osmesa/libOSMesa.8.dylib
      - name: libsweet-gl, tests, wrapper
        run: |
          set -e
          C="xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0"
          M=mesa-25.0.7/build/src/gallium/targets/osmesa/libOSMesa.8.dylib
          mkdir -p obj out/usr/local/lib out/usr/local/bin out/usr/local/libexec out/usr/lib
          cp $M out/usr/local/lib/
          install_name_tool -id /usr/local/lib/libOSMesa.8.dylib out/usr/local/lib/libOSMesa.8.dylib
          # the gl* functions it exports, for mkeagl.py
          nm -gU out/usr/local/lib/libOSMesa.8.dylib | awk '$3 ~ /^_gl/ {print substr($3, 2)}' | sort -u > obj/exported-gl.txt
          wc -l obj/exported-gl.txt
          nm -gU out/usr/local/lib/libOSMesa.8.dylib | grep -E 'sweet_drm_(frame_mark|import_host)' || echo "::warning::libOSMesa does not export sweet_drm_frame_mark"
          grep -c "glEGLImageTargetTexture2DOES" obj/exported-gl.txt || echo "::warning::no glEGLImageTargetTexture2DOES export"
          python3 tools/sweetgl/mkeagl.py tools/sweetgl/eagl_slots.txt mesa-25.0.7/src/mapi/glapi/registry/gl.xml \
            obj/exported-gl.txt tools/sweetgl/eagl.c > obj/eagl_gen.h
          $C -O2 -dynamiclib -install_name /usr/local/lib/libsweet-gl.dylib -Iobj -Itools/sweetgl \
            -Wno-deprecated-declarations -framework CoreFoundation -framework IOKit -framework IOSurface -lobjc -lz \
            out/usr/local/lib/libOSMesa.8.dylib -o out/usr/local/lib/libsweet-gl.dylib \
            tools/sweetgl/eagl.c tools/sweetgl/gl_osmesa.c tools/sweetgl/ca_hooks.c 2>&1 | grep -v "warning: " | head -80
          test -f out/usr/local/lib/libsweet-gl.dylib
          $C -O1 tools/mesa-ios/gltest/gltest.c -framework IOKit -o out/usr/local/bin/gltest
          $C -O1 tools/drawtest/drawtest.c -o out/usr/local/bin/drawtest
          $C -O1 tools/inject/backboardd-wrap.c -o out/usr/local/libexec/backboardd-wrap
          $C -dynamiclib tools/inject/sweetinject.c -install_name /usr/lib/sweetinject.dylib -o out/usr/lib/sweetinject.dylib
          codesign -s - --force out/usr/local/lib/libOSMesa.8.dylib out/usr/local/lib/libsweet-gl.dylib \
            out/usr/local/bin/gltest out/usr/local/bin/drawtest out/usr/local/libexec/backboardd-wrap out/usr/lib/sweetinject.dylib
          otool -L out/usr/local/lib/libsweet-gl.dylib
          ls -lR out
      - uses: actions/upload-artifact@v4
        with:
          name: mesa-ios
          path: out
