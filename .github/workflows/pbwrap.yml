name: pbwrap
on:
  workflow_dispatch:
    inputs:
      runner:
        description: runner image (macos-15; macos-15-intel when the arm64 Macs are queued for hours)
        default: macos-15
jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo xcode-select -s /Applications/Xcode_16.app
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -O1 tools/sweetroot/sweetroot.c -o sweetroot
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -O1 tools/pbwrap/pbwrap.c -o pbwrap
          # names for addresses from earlier boots (CRASH and SMP lines), worked out on the phone with dladdr()
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -O1 tools/sweetsym/sweetsym.c -o sweetsym
          # entitlements of a binary, and which binaries hold one (PosterBoard's RunningBoard refusal, 2026-11-24)
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -O1 tools/sweetents/sweetents.c -o sweetents
          # IOKit services still busy (Settings > About waits for IOKit to go quiet, 2026-11-24)
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -O1 tools/sweetbusy/sweetbusy.c -framework IOKit -o sweetbusy
          # paths by name (where are the poster extensions, 2026-11-24)
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -O1 tools/sweetfind/sweetfind.c -o sweetfind
          # launchd jobs listed / removed in the root's launchd.plist (vmd spinning with no telephony, 2026-11-26)
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -O1 -Wall tools/sweetjob/sweetjob.c -framework CoreFoundation -o sweetjob
          # which preference WallpaperKit reads for wallpapers of another screen class, and set it (2026-11-26)
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -O1 -Wall tools/sweetwk/sweetwk.c -framework CoreFoundation -lobjc -o sweetwk
          # a program's own os_log caught inside it, for PosterBoard/SpringBoard (2026-11-26)
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -O1 -dynamiclib \
              -Wl,-not_for_dyld_shared_cache -install_name /usr/local/bin/sweetlogcatch.dylib \
              tools/sweetlogcatch/sweetlogcatch.c -o sweetlogcatch.dylib
          # LaunchServices told of the system's bundles and poster extensions (wallpaper, 2026-11-26)
          # stacks of named processes, named on the phone (LaunchServices' rebuild that never came back, 2026-11-27)
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -O1 tools/sweetstack/sweetstack.c -o sweetstack
          # CoreAnimation render-server snapshot + IOSurfaceAccelerator checks (black previews; from ios-hotdogg caprobe, MIT)
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -O1 tools/sweetcaprobe/sweetcaprobe.c -framework CoreFoundation -framework IOSurface -lobjc -o sweetcaprobe
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -O1 tools/sweetls/sweetls.c -framework CoreFoundation -framework CoreGraphics -framework ImageIO -lobjc -o sweetls
          # sweet-boot with the streamed outbox (jetsam killed the one with a 32 MB buffer, 2026-11-24)
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -O1 tools/sweetboot/sweet-boot.c -o sweet-boot
          # install-wrap with --patch/--verify (2026-11-16): the copy on the phone came from inject.yml before them
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -O1 tools/inject/install-wrap.c -o install-wrap
          # _bs_set_crash_log_message lives in BoardServices, not in the SDK: the interposition table points at a
          # symbol the linker cannot see, so it is left to launch time (-undefined dynamic_lookup, as Mesa's macOS
          # driver and the PanVK dylib in this repo are linked). A dylib in /usr/lib counts as eligible for the shared
          # cache, which refuses dynamic_lookup: -not_for_dyld_shared_cache opts it out (CI 2026-11-23).
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -O1 -dynamiclib \
              -Wl,-undefined,dynamic_lookup -Wl,-not_for_dyld_shared_cache -install_name /usr/lib/sweetposter.dylib \
              tools/pbwrap/sweetposter.c -o sweetposter.dylib
          # the interposition table has to hold exactly two addresses per pair; the undefined list shows what is left
          # to launch time
          otool -s __DATA __interpose sweetposter.dylib
          otool -s __DATA_CONST __interpose sweetposter.dylib
          nm -u sweetposter.dylib | sort
          codesign -s - --force sweetcaprobe sweetroot pbwrap install-wrap sweetsym sweetents sweetbusy sweetfind sweetjob sweetwk sweetls sweet-boot sweetposter.dylib sweetlogcatch.dylib
          # lsd refuses the rebuild without these (round ar: "database rebuilt: 0, 0 s"; S7 hero-run.entitlements)
          codesign -s - --force --entitlements tools/sweetls/sweetls.entitlements sweetls
          codesign -d --entitlements - sweetls
          codesign -s - --force --entitlements tools/sweetstack/sweetstack.entitlements sweetstack
          mkdir -p drop/usr/local/bin drop/usr/local/libexec drop/usr/lib drop/usr/local/etc drop/var/sweet
          cp sweetroot install-wrap sweetsym sweetents sweetbusy sweetfind sweetjob sweetwk sweetls sweetstack sweetcaprobe sweet-boot sweetlogcatch.dylib drop/usr/local/bin/
          cp pbwrap drop/usr/local/libexec/
          cp sweetposter.dylib drop/usr/lib/
          cp tools/pbwrap/root.cmd drop/var/sweet/
          cp tools/pbwrap/sweet-boot.list drop/usr/local/etc/
          find drop -type f -exec shasum -a 256 {} +
      - uses: actions/upload-artifact@v4
        with:
          name: pbwrap
          path: drop
