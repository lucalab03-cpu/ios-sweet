name: drawtest
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo xcode-select -s /Applications/Xcode_16.app
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -O1 tools/drawtest/drawtest.c -o drawtest
          codesign -s - --force drawtest
          mkdir -p out/usr/local/bin && cp drawtest out/usr/local/bin/
      - uses: actions/upload-artifact@v4
        with:
          name: drawtest
          path: out
