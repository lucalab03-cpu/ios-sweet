name: metal2
# Phase 2 of docs/METAL-PANVK.md: the native Metal bridge (tools/metal2/bridge, NativeMetal from ios-flame, MIT) over the
# metal2vulkan runtime (steelbrain/metal2vulkan at UniXNU's/ios-flame's pin + tools/metal2/bridge/patches; GPL-2.0+ OR
# LGPL-3.0+), built as a static library for iOS 16 arm64, and m2vtest, its self-test, which drives PanVK
# (/usr/local/lib/libvulkan_panfrost.dylib from the panvk-ios drop). Runs on every push to these paths.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: runner label (macos-15-intel when the arm64 Macs are queued)
        required: false
        default: macos-15
  push:
    paths:
      - 'tools/metal2/**'
      - 'tools/sweetsvc/**'
      - '.github/workflows/metal2.yml'
jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 120
    env:
      M2V_REPO: https://github.com/steelbrain/metal2vulkan
      M2V_PIN: 720ef1ce
      RUST: 1.98.0
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          brew install llvm
          rustup toolchain install "$RUST" --profile minimal --target aarch64-apple-ios
          rustup run "$RUST" rustc --version
      - name: metal2vulkan at the pin, with the bridge's patches
        run: |
          set -e
          git clone -q --filter=blob:none "$M2V_REPO" m2v
          git -C m2v checkout -q "$M2V_PIN" || { echo "::error::metal2vulkan pin $M2V_PIN not found"; exit 1; }
          git -C m2v log --oneline -1
          for p in tools/metal2/bridge/patches/*.patch; do
            git -C m2v apply --whitespace=nowarn "$PWD/$p" || { echo "::error::patch $(basename $p) does not apply"; exit 1; }
            echo "applied $(basename $p)"
          done
      - name: Bridge for iOS
        run: |
          set -e
          sudo xcode-select -s /Applications/Xcode_16.app
          OUT=$PWD/m2v-bridge
          mkdir -p "$OUT"
          LLVM_AS=$(brew --prefix)/opt/llvm/bin/llvm-as
          "$LLVM_AS" -o "$OUT/runtime_examples.air" m2v/crates/metal2vulkan-validation/fixtures/public/examples/runtime_examples.ll
          "$LLVM_AS" -o "$OUT/function_constant.air" m2v/crates/metal2vulkan-validation/fixtures/public/kernel_function_constant_gate_fold.ll
          cat > "$OUT/Cargo.toml" <<EOF
          [package]
          name = "native-metal-bridge"
          version = "0.1.0"
          edition = "2024"
          rust-version = "1.98"
          [workspace]
          [lib]
          crate-type = ["staticlib"]
          path = "$PWD/tools/metal2/bridge/NativeMetalBridge.rs"
          [dependencies]
          metal2vulkan = { path = "$PWD/m2v/crates/metal2vulkan", features = ["ash"] }
          metal2vulkan-runtime = { path = "$PWD/m2v/crates/metal2vulkan-runtime" }
          libc = "0.2"
          sha2 = { version = "0.10", features = ["asm"] }
          [profile.release]
          panic = "unwind"
          debug = 1
          EOF
          NMB_FIXTURE_AIR=$OUT/runtime_examples.air NMB_FC_AIR=$OUT/function_constant.air IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            cargo +"$RUST" build --release --manifest-path "$OUT/Cargo.toml" --target aarch64-apple-ios \
            --target-dir "$OUT/target" > bridge-build.log 2>&1 \
            || { grep -E "^error" -A8 bridge-build.log | head -80; grep -E "^error" bridge-build.log | sort -u | head -20 | sed 's/^/::error::bridge: /'; exit 1; }
          ls -la "$OUT/target/aarch64-apple-ios/release/libnative_metal_bridge.a"
      - name: m2vtest and package
        run: |
          set -e
          C="xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -O2"
          $C -Itools/metal2 tools/metal2/m2vtest.c m2v-bridge/target/aarch64-apple-ios/release/libnative_metal_bridge.a \
            -Wl,-dead_strip -o m2vtest > link.log 2>&1 || { cat link.log | head -60; grep -E "error|Undefined|\"_" link.log | head -30 | sed 's/^/::error::link: /'; exit 1; }
          grep -v "was built for newer" link.log || true
          echo "m2vtest before strip: $(stat -f %z m2vtest) bytes"
          strip -x m2vtest
          echo "m2vtest after strip: $(stat -f %z m2vtest) bytes"
          echo "weak imports (missing on iOS 16 would be NULL):"; nm -m m2vtest | grep "weak external" || true
          codesign -s - --force m2vtest
      - name: Metal driver bundle, mtltest and its shaders (phase 3)
        run: |
          set -e
          C="xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0"
          BRIDGE=m2v-bridge/target/aarch64-apple-ios/release/libnative_metal_bridge.a
          B=SweetMTLDriver.bundle
          mkdir -p "$B"
          # _MTLDevice is Metal's private class: its symbols are looked up when the bundle loads (-U)
          $C -O2 -x objective-c++ -std=c++17 -fobjc-arc -Wno-deprecated-declarations -bundle -Itools/metal2 \
            tools/metal2/SweetMTLDriver.mm tools/metal2/NativeBridgeMetalFrontend.mm -x none "$BRIDGE" -Wl,-dead_strip -lc++ \
            -framework Foundation -framework Metal -framework IOSurface -framework IOKit -framework CoreFoundation \
            '-Wl,-U,_OBJC_CLASS_$__MTLDevice' '-Wl,-U,_OBJC_METACLASS_$__MTLDevice' -o "$B/SweetMTLDriver" > bundle.log 2>&1 \
            || { grep -E "error" bundle.log | sort -u | head -30 | sed 's/^/::error::bundle: /'; head -80 bundle.log; exit 1; }
          grep -v "was built for newer" bundle.log || true
          # before strip, for naming the profiler's addresses (kernel 0144); not for the phone
          mkdir -p symbols && cp "$B/SweetMTLDriver" symbols/SweetMTLDriver.unstripped
          strip -x "$B/SweetMTLDriver"
          echo "bundle: $(stat -f %z $B/SweetMTLDriver) bytes"
          nm -m "$B/SweetMTLDriver" | grep "weak external" | grep -v "dynamically looked up" || true
          cp tools/metal/Info.plist "$B/Info.plist"
          codesign -s - --force "$B/SweetMTLDriver"
          $C -O1 -fobjc-arc tools/metal2/mtltest.m -framework Foundation -framework Metal -framework IOSurface -o mtltest
          $C -O1 tools/sweetsvc/sweetsvc.c -framework CoreFoundation -o sweetsvc
          codesign -s - --force mtltest sweetsvc
          xcrun -sdk iphoneos metal -std=ios-metal2.4 -mios-version-min=16.0 -c tools/metal2/mtltest.metal -o mtltest.air
          xcrun -sdk iphoneos metallib mtltest.air -o mtltest.metallib
          ls -l mtltest.metallib
      - name: Package
        run: |
          set -e
          mkdir -p drop/usr/local/bin drop/usr/local/etc drop/usr/local/share/sweet drop/System/Library/Extensions/SweetMTLDriver.bundle drop/var/sweet
          # m2vtest (about 20 MB) stays out of the drop: the one already on the phone does; the artifact keeps it apart
          cp mtltest sweetsvc drop/usr/local/bin/
          # phase 4: backboardd gets the Metal device (the wrapper runs it as backboardd.orig). PosterBoard draws the
          # wallpaper with Metal; without a device it dies with SIGTRAP (boot 2026-11-15) and the wallpaper stays black
          printf 'backboardd\nbackboardd.orig\nPosterBoard\nmetaltest\nmtltest\n' > drop/var/sweet/metal.allow
          # daemons that only respawn on this phone (boot 2026-11-14: 335 starts each); sweetsvc disables them from the next boot
          printf 'bluetoothd\nfairplayd.H2\n' > drop/var/sweet/svc-disable
          # the rescue drop: Metal back to the tests only (sweet-boot can overwrite, not delete)
          mkdir -p rescue/var/sweet && printf 'metaltest\nmtltest\n' > rescue/var/sweet/metal.allow
          mkdir -p extra && cp m2vtest extra/
          cp mtltest.metallib drop/usr/local/share/sweet/
          cp SweetMTLDriver.bundle/SweetMTLDriver SweetMTLDriver.bundle/Info.plist drop/System/Library/Extensions/SweetMTLDriver.bundle/
          # the Metal tests last (a slow dropbox install may still be copying them); mtltest twice: the second run's
          # pipeline times show the shader cache
          printf '/usr/local/bin/install-wrap\n/usr/local/bin/sweetsvc\n&/usr/local/bin/sweetaccel-d\n/usr/local/bin/vktest\n/usr/local/bin/gltest\n/usr/local/bin/shadertest\n/usr/local/bin/drawtest\n/usr/local/bin/m2vtest\n/usr/local/bin/metaltest\n/usr/local/bin/mtltest\n/usr/local/bin/mtltest\n' > drop/usr/local/etc/sweet-boot.list
          find drop -type f -exec ls -l {} \;
      - uses: actions/upload-artifact@v4
        with:
          name: metal2
          path: drop
      - uses: actions/upload-artifact@v4
        with:
          name: metal2-symbols
          path: symbols
      - uses: actions/upload-artifact@v4
        with:
          name: m2vtest
          path: extra
      - uses: actions/upload-artifact@v4
        with:
          name: metal2-rescue
          path: rescue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metal2-logs
          path: '*.log'
          if-no-files-found: ignore
